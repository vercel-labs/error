name: Release

# Opens / updates a "chore: release" PR when changesets are queued on main.
# Uses changesets/action with `commitMode: github-api`, so commits go through
# the GitHub REST API and are auto-signed by GitHub's signing key. This
# satisfies the "Commits must have verified signatures" repository rule
# without any GPG key management or bypass exceptions.
#
# Publishing to npm uses an automation token (NPM_TOKEN_ELEVATED).
# We would prefer npm Trusted Publishing (provenance via OIDC), but npm
# only supports it for public packages on public GitHub repos. Since this
# is an internal private package, we fall back to token-based auth.
# See https://docs.npmjs.com/trusted-publishers for details.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Re-run the full validation gate on the merge commit before doing
      # anything release-related. Branch protection covers the PR's HEAD,
      # but flaky tests, dep drift, or admin merges can let a broken commit
      # land on main. Anything publish-worthy must pass these checks first.
      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: release"
          title: "chore: release"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_ELEVATED }}
