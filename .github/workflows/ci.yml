name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress PR runs on new pushes; let main runs finish so the
# release workflow's history stays uninterrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify bundle size and README table
        run: |
          pnpm size:readme
          git diff --exit-code README.md \
            || (echo "README bundle-size table is stale. Run 'pnpm size:readme' and commit the result." && exit 1)

      - name: Verify packed package
        run: pnpm verify:packed

      - name: Verify agent skill
        run: pnpm verify:skill

      - name: Unit tests
        run: pnpm test
